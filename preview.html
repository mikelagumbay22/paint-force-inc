/* ===== src/lib/api.js ===== */
/**
 * Mock API layer.
 * =============================================================================
 * Everything the UI needs to talk to a server goes through this one file, so
 * swapping in a real backend means rewriting four function bodies and nothing
 * else. Each function already returns the exact shape the components expect.
 *
 * To go live, replace the body of each function with a fetch, e.g.
 *
 *   export async function createBooking(payload) {
 *     const res = await fetch('/api/bookings', {
 *       method: 'POST',
 *       headers: { 'Content-Type': 'application/json' },
 *       body: JSON.stringify(payload),
 *     })
 *     if (!res.ok) throw new ApiError(await res.text())
 *     return res.json()
 *   }
 *
 * Keep throwing ApiError on failure — the UI catches it and shows the message
 * verbatim, so whatever the server says is what the customer reads.
 */

const LATENCY = [420, 900] // simulated round-trip, ms
const FAILURE_RATE = 0 // bump to 0.25 to exercise the error states

class ApiError extends Error {
  constructor(message, field) {
    super(message)
    this.name = 'ApiError'
    this.field = field // lets the form highlight the offending input
  }
}

const wait = () =>
  new Promise((r) => setTimeout(r, LATENCY[0] + Math.random() * (LATENCY[1] - LATENCY[0])))

async function transport() {
  await wait()
  if (Math.random() < FAILURE_RATE) {
    throw new ApiError("The request didn't reach our dispatch system. Try again.")
  }
}

/* --- Store ---------------------------------------------------------------
   In-memory on purpose: no storage APIs, so this drops into any sandbox
   unchanged. Point it at your database and the rest of the file still works. */

const STAGES = [
  { id: 'received', label: 'Request received', note: 'Damage photos logged and reviewed.' },
  { id: 'scheduled', label: 'Appointment set', note: 'Technician and mobile unit assigned.' },

  { id: 'progress', label: 'Repair underway', note: 'Colour matched, panel prepped, work started.' },

]

/* --- Availability -------------------------------------------------------- */

const HOURS = ['08:00', '10:00', '12:00', '14:00', '16:00']

// Deterministic hash so a given date always returns the same slots. Random
// availability that reshuffles on every render feels broken to a user.
function hash(str) {
  let h = 0
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0
  return Math.abs(h)
}

async function getAvailability(dateISO) {
  await transport()
  const seed = hash(dateISO)
  const day = new Date(dateISO + 'T12:00:00').getDay()
  return HOURS.map((time, i) => ({
    time,
    // Sundays closed; otherwise about a third of slots are already taken.
    available: day === 0 ? false : (seed >> (i * 2)) % 3 !== 0,
  }))
}

/* --- Bookings ------------------------------------------------------------ */

async function createBooking(payload) {
  await transport()

  if (!payload.service) throw new ApiError('Choose a service first.', 'service')
  if (!payload.vehicle?.trim()) throw new ApiError('Tell us the vehicle make and model.', 'vehicle')
  if (!payload.date || !payload.time) throw new ApiError('Pick a date and arrival window.', 'date')
  if (!payload.name?.trim()) throw new ApiError('Add a name for the appointment.', 'name')
  if (!isEmail(payload.email)) throw new ApiError('That email address looks incomplete.', 'email')
  if (digits(payload.phone).length < 10)
    throw new ApiError('A 10-digit phone number lets the tech text an ETA.', 'phone')

  const reference = nextReference()
  const booking = {
    ...payload,
    reference,
    stage: 'scheduled',
    tech: 'Assigning',
    window: windowFor(payload.time),
    createdAt: new Date().toISOString(),
  }
  bookings.set(reference, booking)
  return booking
}

async function getRepair(reference) {
  await transport()
  const key = String(reference || '').trim().toUpperCase()
  const booking = bookings.get(key)
  if (!booking) {
    throw new ApiError(`No job found for ${key || 'that reference'}. Check the code on your confirmation email.`)
  }
  const index = STAGES.findIndex((s) => s.id === booking.stage)
  return { ...booking, stageIndex: index, stages: STAGES }
}

/* --- Quote requests ------------------------------------------------------ */

async function submitQuote(payload) {
  await transport()
  if (!payload.name?.trim()) throw new ApiError('Add your name so we know who to reply to.', 'name')
  if (!isEmail(payload.email)) throw new ApiError('That email address looks incomplete.', 'email')
  if (digits(payload.phone).length < 10) throw new ApiError('Add a 10-digit phone number.', 'phone')
  if (!payload.vehicle?.trim()) throw new ApiError('Which vehicle are we quoting?', 'vehicle')
  if (!payload.service) throw new ApiError('Pick the closest service.', 'service')
  if (!payload.description?.trim() || payload.description.trim().length < 12)
    throw new ApiError('A sentence or two about the damage speeds up the estimate.', 'description')

  const reference = nextReference()
  bookings.set(reference, {
    ...payload,
    reference,
    stage: 'received',
    date: 'Pending',
    window: 'Pending',
    tech: 'Unassigned',
  })
  return { reference }
}

/* --- Helpers ------------------------------------------------------------- */

const digits = (v) => String(v || '').replace(/\D/g, '')
const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim())

function windowFor(time) {
  const [h] = time.split(':').map(Number)
  return `${time} – ${String(h + 2).padStart(2, '0')}:00`
}

function formatPhone(value) {
  const d = digits(value).slice(0, 10)
  if (d.length < 4) return d
  if (d.length < 7) return `(${d.slice(0, 3)}) ${d.slice(3)}`
  return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`
}

/* ===== src/lib/asset.js ===== */
/**
 * Public-folder paths under the Vite `base` (GitHub Pages project site).
 * `'/'` is `/` in local preview.html and `/paint-force-inc/`
 * in the Pages build.
 */
function publicUrl(path) {
  if (!path || /^(https?:)?\/\//.test(path) || path.startsWith('data:')) return path
  const base = '/' || '/'
  return `${base}${String(path).replace(/^\//, '')}`
}

/** App route (`/gallery`) from a browser pathname that includes the base. */
function appPath(pathname) {
  const base = ('/' || '/').replace(/\/$/, '')
  let bare = String(pathname || '/').split('?')[0].split('#')[0]
  if (base && (bare === base || bare.startsWith(`${base}/`))) {
    bare = bare.slice(base.length) || '/'
  }
  if (!bare.startsWith('/')) bare = `/${bare}`
  if (bare.length > 1 && bare.endsWith('/')) bare = bare.slice(0, -1)
  return bare || '/'
}

/** Browser href for an app route, including the Pages subpath. */
function appHref(to) {
  const next = appPath(to)
  const base = ('/' || '/').replace(/\/$/, '')
  if (next === '/') return base ? `${base}/` : '/'
  return `${base}${next}`
}

/* ===== src/lib/hooks.js ===== */
/** Adds .is-visible once an element scrolls into view. One-shot: no replay on
 *  scroll-up, which reads as twitchy on a long page. */
function useReveal(options = {}) {
  const ref = useRef(null)
  useEffect(() => {
    const el = ref.current
    if (!el) return
    // Reveals the container and any nested .reveal children, so a grid can
    // stagger its cards off a single observer.
    const show = () => {
      el.classList.add('is-visible')
      el.querySelectorAll('.reveal').forEach((n) => n.classList.add('is-visible'))
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      show()
      return
    }
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          show()
          io.disconnect()
        }
      },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px', ...options }
    )
    io.observe(el)
    return () => io.disconnect()
  }, [])
  return ref
}

/** Staggers children of a revealed container by index. */
function revealDelay(i, step = 70) {
  return { transitionDelay: `${i * step}ms` }
}

function useScrolled(threshold = 24) {
  const [scrolled, setScrolled] = useState(false)
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > threshold)
    onScroll()
    window.addEventListener('scroll', onScroll, { passive: true })
    return () => window.removeEventListener('scroll', onScroll)
  }, [threshold])
  return scrolled
}

/** Which section is currently under the header. Drives the nav underline. */
function useActiveSection(ids) {
  const [active, setActive] = useState(null)
  useEffect(() => {
    const sections = ids.map((id) => document.getElementById(id)).filter(Boolean)
    if (!sections.length) return
    const io = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]
        if (visible) setActive(visible.target.id)
      },
      { rootMargin: '-45% 0px -50% 0px', threshold: [0, 0.25, 0.5] }
    )
    sections.forEach((s) => io.observe(s))
    return () => io.disconnect()
  }, [ids.join('|')])
  return active
}

function useBodyLock(locked) {
  useEffect(() => {
    if (!locked) return
    const { overflow, paddingRight } = document.body.style
    const gap = window.innerWidth - document.documentElement.clientWidth
    document.body.style.overflow = 'hidden'
    if (gap > 0) document.body.style.paddingRight = `${gap}px`
    return () => {
      document.body.style.overflow = overflow
      document.body.style.paddingRight = paddingRight
    }
  }, [locked])
}

/** Reads the OS motion preference on the first render so nothing flashes. */
function useReducedMotion() {
  const [reduce, setReduce] = useState(() =>
    typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  )
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)')
    const onChange = () => setReduce(mq.matches)
    mq.addEventListener('change', onChange)
    return () => mq.removeEventListener('change', onChange)
  }, [])
  return reduce
}

/**
 * Slow vertical drift for a hero image. Transform only, so the layout box
 * never moves. Skipped on small screens and when reduced motion is requested.
 */
function useParallax(ref, speed = 0.08) {
  useEffect(() => {
    const el = ref.current
    if (!el) return
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)')
    const desktop = window.matchMedia('(min-width: 768px)')
    let raf = 0

    const paint = () => {
      const y = Math.min(window.scrollY, window.innerHeight) * speed
      el.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0)`
    }

    const onScroll = () => {
      if (reduce.matches || !desktop.matches) {
        el.style.transform = ''
        return
      }
      cancelAnimationFrame(raf)
      raf = requestAnimationFrame(paint)
    }

    paint()
    window.addEventListener('scroll', onScroll, { passive: true })
    reduce.addEventListener('change', onScroll)
    desktop.addEventListener('change', onScroll)
    return () => {
      cancelAnimationFrame(raf)
      window.removeEventListener('scroll', onScroll)
      reduce.removeEventListener('change', onScroll)
      desktop.removeEventListener('change', onScroll)
      el.style.transform = ''
    }
  }, [speed])
}

function usePageMeta(title, description) {
  useEffect(() => {
    if (title) document.title = title
    if (!description) return
    const el = document.querySelector('meta[name="description"]')
    if (el) el.setAttribute('content', description)
  }, [title, description])
}

/* ===== src/lib/router.jsx ===== */
/**
 * pushState plus a listener set. Routes stay root-shaped (`/gallery`);
 * the browser path includes the Vite base so GitHub Pages project sites work.
 */
const listeners = new Set()

function normalizePath(path) {
  return appPath(path)
}

{ appHref }

function navigate(to) {
  const next = appPath(to)
  if (next !== appPath(window.location.pathname)) {
    window.history.pushState({}, '', appHref(next))
    listeners.forEach((l) => l())
  }
  window.scrollTo(0, 0)
}

function useRoute() {
  const [path, setPath] = useState(() => appPath(window.location.pathname))
  useEffect(() => {
    const onChange = () => setPath(appPath(window.location.pathname))
    listeners.add(onChange)
    window.addEventListener('popstate', onChange)
    return () => {
      listeners.delete(onChange)
      window.removeEventListener('popstate', onChange)
    }
  }, [])
  return path
}

function Link({ to, onClick, children, ...rest }) {
  return (
    <a
      href={appHref(to)}
      onClick={(e) => {
        onClick?.(e)
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
        e.preventDefault()
        navigate(to)
      }}
      {...rest}
    >
      {children}
    </a>
  )
}

const ToastContext = createContext(() => {})
const useToast = () => useContext(ToastContext)

let id = 0

function ToastProvider({ children }) {
  const [items, setItems] = useState([])

  const dismiss = useCallback((key) => setItems((t) => t.filter((i) => i.key !== key)), [])

  const push = useCallback(
    (message, tone = 'info') => {
      const key = ++id
      setItems((t) => [...t, { key, message, tone }])
      setTimeout(() => dismiss(key), 5200)
    },
    [dismiss]
  )

  const value = useMemo(() => push, [push])

  return (
    <ToastContext.Provider value={value}>
      {children}
      <div
        aria-live="polite"
        className="fixed bottom-5 left-1/2 z-[100] flex w-[calc(100%-32px)] max-w-sm -translate-x-1/2 flex-col gap-2 sm:left-auto sm:right-6 sm:translate-x-0"

            key={t.key}

            style={{

const FOCUSABLE =
  'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'

function Modal({ open, onClose, label, children, width = 'max-w-3xl' }) {
  const panel = useRef(null)
  const restore = useRef(null)
  useBodyLock(open)

  useEffect(() => {
    if (!open) return
    restore.current = document.activeElement

    const first = panel.current?.querySelector(FOCUSABLE)
    // Delay a frame so the entry animation doesn't fight the scroll-into-view.
    const t = setTimeout(() => (first || panel.current)?.focus(), 40)

    const onKey = (e) => {
      if (e.key === 'Escape') return onClose()
      if (e.key !== 'Tab') return
      const nodes = [...(panel.current?.querySelectorAll(FOCUSABLE) || [])]
      if (!nodes.length) return
      const [start, end] = [nodes[0], nodes[nodes.length - 1]]
      if (e.shiftKey && document.activeElement === start) {
        e.preventDefault()
        end.focus()
      } else if (!e.shiftKey && document.activeElement === end) {
        e.preventDefault()
        start.focus()
      }
    }

    document.addEventListener('keydown', onKey)
    return () => {
      clearTimeout(t)
      document.removeEventListener('keydown', onKey)
      restore.current?.focus?.()
    }
  }, [open, onClose])

  if (!open) return null

  return (
    <div className="fixed inset-0 z-[90] flex items-end justify-center sm:items-center">
      <div
        className="absolute inset-0 bg-black/70 backdrop-blur-sm"
        onClick={onClose}
        style={{ animation: 'fade .2s ease both' }}
      />
      <div
        ref={panel}
        aria-label={label}
        aria-modal="true"
        className={`s-low hairline relative flex max-h-[92vh] w-full ${width} flex-col overflow-hidden rounded-t-lg sm:rounded-lg`}
        role="dialog"
        style={{
          animation: 'panel-in .32s cubic-bezier(.2,.7,.3,1) both',
          boxShadow: '0 40px 80px -30px #000',
        }}
        tabIndex={-1}
      >
        <button
          aria-label="Close"
          className="c-variant absolute right-3 top-3 z-10 rounded p-2 transition-colors hover:bg-white/5 hover:text-white"
          onClick={onClose}
          type="button"
        >
          <Icon name="close" size={18} />
        </button>
        {children}
      </div>
      <style>{`
        @keyframes fade{from{opacity:0}to{opacity:1}}
        @keyframes panel-in{from{opacity:0;transform:translateY(24px) scale(.99)}to{opacity:1;transform:none}}
        @media (prefers-reduced-motion: reduce){
          [role=dialog]{animation:none !important}
        }
      `}</style>
    </div>
  )
}

/**
 * Drag, click, or arrow-key comparison. Composite files are side-by-side
 * before | after shots, so each half is cropped to fill the frame.
 */
function BeforeAfter({ src, alt = '', className = '' }) {
  const box = useRef(null)
  const [pos, setPos] = useState(58)
  const [width, setWidth] = useState(0)
  const [failed, setFailed] = useState(false)

  useEffect(() => {
    const el = box.current
    if (!el || failed) return
    const measure = () => setWidth(el.clientWidth)
    measure()
    const ro = new ResizeObserver(measure)
    ro.observe(el)
    return () => ro.disconnect()
  }, [failed])

  const setFromX = (clientX) => {
    const rect = box.current?.getBoundingClientRect()
    if (!rect?.width) return
    const next = ((clientX - rect.left) / rect.width) * 100
    setPos(Math.min(94, Math.max(6, next)))
  }

  const onKey = (e) => {
    if (e.key === 'ArrowLeft') {
      e.preventDefault()
      setPos((p) => Math.max(6, p - 4))
    } else if (e.key === 'ArrowRight') {
      e.preventDefault()
      setPos((p) => Math.min(94, p + 4))
    }
  }

  if (failed || !src) {
    return (
      <div
        aria-label={alt || 'Illustrative photo unavailable'}
        className={`s-container relative flex items-center justify-center ${className}`}
        role="img"
      >
        <span className="t-caps c-variant px-4 text-center text-[10px] opacity-70">
          Illustrative photo unavailable
        </span>
      </div>
    )
  }

  return (
    <div
      aria-label={alt}
      className={`relative touch-none select-none overflow-hidden ${className}`}
      onPointerDown={(e) => {
        if (e.button !== 0) return
        e.currentTarget.setPointerCapture(e.pointerId)
        setFromX(e.clientX)
      }}
      onPointerMove={(e) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return
        setFromX(e.clientX)
      }}
      ref={box}
      role="group"
    >
      <img
        alt=""
        className="pointer-events-none absolute h-px w-px opacity-0"
        onError={() => setFailed(true)}
        src={src}
      />
      <div
        aria-hidden="true"
        className="absolute inset-0"
        style={{
          backgroundImage: `url("${src}")`,
          backgroundPosition: 'right center',
          backgroundRepeat: 'no-repeat',
          backgroundSize: '200% 100%',
        }}
      />
      <div className="absolute inset-y-0 left-0 overflow-hidden" style={{ width: `${pos}%` }}>
        <div
          className="absolute inset-y-0 left-0 h-full"
          style={{
            width: width ? `${width}px` : '100%',
            backgroundImage: `url("${src}")`,
            backgroundPosition: 'left center',
            backgroundRepeat: 'no-repeat',
            backgroundSize: width ? `${width * 2}px 100%` : '200% 100%',
          }}
        />
      </div>

      <span
        className="t-caps pointer-events-none absolute left-3 top-3 rounded-sm px-2 py-1 text-[10px]"
        style={{ background: 'rgba(11,15,18,.72)', color: 'var(--on-surface)' }}
      >
        Before
      </span>
      <span
        className="t-caps pointer-events-none absolute right-3 top-3 rounded-sm px-2 py-1 text-[10px]"
        style={{ background: 'rgba(11,15,18,.72)', color: 'var(--primary)' }}
      >
        After
      </span>
      <span className="chip badge-illustrative pointer-events-none absolute bottom-3 left-3">Illustrative</span>

      <div
        aria-label="Compare before and after"
        aria-valuemax={100}
        aria-valuemin={0}
        aria-valuenow={Math.round(pos)}
        aria-valuetext={`${Math.round(pos)} percent across the repair`}
        className="absolute inset-y-0 z-10 w-11 -translate-x-1/2 cursor-ew-resize focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2"
        onKeyDown={onKey}
        role="slider"
        style={{ left: `${pos}%` }}
        tabIndex={0}
      >
        <span className="absolute inset-y-0 left-1/2 w-0.5 -translate-x-1/2 bg-white" />
        <span
          className="absolute left-1/2 top-1/2 flex h-9 w-9 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full"
          style={{ background: '#fff', color: '#1c2024' }}
        >
          <Icon name="sliders" size={16} />
        </span>
      </div>
    </div>
  )
}

/** Pointer tilt for fine pointers. The transform stays on this wrapper so it
 *  never fights a scroll-reveal transform on the parent, and it does not
 *  change the layout box. */
function Tilt({ children, className = '' }) {
  const ref = useRef(null)
  const reduce = useReducedMotion()

  const onMove = (e) => {
    if (reduce || window.matchMedia('(pointer: coarse)').matches) return
    const el = ref.current
    if (!el) return
    const r = el.getBoundingClientRect()
    const x = (e.clientX - r.left) / r.width - 0.5
    const y = (e.clientY - r.top) / r.height - 0.5
    el.style.transform = `perspective(900px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg)`
  }

  const reset = () => {
    if (ref.current) ref.current.style.transform = ''
  }

  return (
    <div className={className} onPointerLeave={reset} onPointerMove={onMove} ref={ref} style={{ transition: reduce ? 'none' : 'transform .16s ease-out' }}>
      {children}
    </div>
  )
}

/* ===== src/components/Counter.jsx ===== */
function Counter({ value, label, note }) {
  const ref = useRef(null)
  const reduce = useReducedMotion()
  const [n, setN] = useState(reduce ? value : 0)

  useEffect(() => {
    if (reduce) {
      setN(value)
      return
    }
    const el = ref.current
    if (!el) return
    let raf = 0
    const io = new IntersectionObserver(
      ([entry]) => {
        if (!entry.isIntersecting) return
        io.disconnect()
        const start = performance.now()
        const tick = (now) => {
          const t = Math.min(1, (now - start) / 900)
          const eased = 1 - Math.pow(1 - t, 3)
          setN(Math.round(value * eased))
          if (t < 1) raf = requestAnimationFrame(tick)
        }
        raf = requestAnimationFrame(tick)
      },
      { threshold: 0.45 }
    )
    io.observe(el)
    return () => {
      io.disconnect()
      cancelAnimationFrame(raf)
    }
  }, [reduce, value])

  return (
    <div ref={ref}>
      <span
        className="t-display c-on tabular inline-block"
        style={{ minWidth: `${String(value).length}ch` }}
      >
        {n}
      </span>
      <span className="t-h3 c-on mt-2 block">{label}</span>
      {note && <span className="t-caps c-variant mt-2 block text-[10px] opacity-60">{note}</span>}
    </div>
  )
}

/* ===== src/components/HeroScrub.jsx ===== */
const VIDEO_SRC = publicUrl('/hero-video/painter-turn-720p-intra.mp4')
const POSTER_SRC = publicUrl('/hero-video/poster.jpg')
const FRAME_COUNT = 30
const DURATION_FALLBACK = 3

const clamp = (n, a, b) => Math.min(b, Math.max(a, n))

function frameSrc(index) {
  return publicUrl(`/hero-video/frames/frame-${String(index + 1).padStart(3, '0')}.jpg`)
}

function drawCover(ctx, img, width, height) {
  const ir = img.naturalWidth / img.naturalHeight
  const cr = width / height
  let dw
  let dh
  let dx
  let dy
  if (ir > cr) {
    dh = height
    dw = height * ir
    dx = (width - dw) / 2
    dy = 0
  } else {
    dw = width
    dh = width / ir
    dx = 0
    dy = (height - dh) / 2
  }
  ctx.drawImage(img, dx, dy, dw, dh)
}

/**
 * Cursor-scrubbed hero. The clip does not autoplay: pointer X maps to
 * currentTime through a smoothed animation frame. Touch uses scroll while
 * the finger is moving, then a slow ping-pong. If seeking never lands,
 * the 30 stills are drawn on a canvas instead.
 */
function HeroScrub() {
  const root = useRef(null)
  const videoRef = useRef(null)
  const canvasRef = useRef(null)
  const reduce = useReducedMotion()
  const [engine, setEngine] = useState('poster')

  useEffect(() => {
    if (reduce) return undefined
    const rootEl = root.current
    const video = videoRef.current
    if (!rootEl || !video) return undefined

    let dead = false
    let raf = 0
    let target = 0
    let shown = 0
    let duration = DURATION_FALLBACK
    let mode = 'video'
    let frames = []
    let lastIndex = -1
    let ping = 0
    let pingDir = 1
    let lastTs = 0
    let scrolling = false
    let scrollTimer = 0
    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches

    const resizeCanvas = () => {
      const canvas = canvasRef.current
      if (!canvas) return null
      const dpr = Math.min(window.devicePixelRatio || 1, 2)
      const width = rootEl.clientWidth
      const height = rootEl.clientHeight
      const nextW = Math.max(1, Math.round(width * dpr))
      const nextH = Math.max(1, Math.round(height * dpr))
      if (canvas.width !== nextW || canvas.height !== nextH) {
        canvas.width = nextW
        canvas.height = nextH
        lastIndex = -1
      }
      const ctx = canvas.getContext('2d')
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      return { ctx, width, height }
    }

    const drawFrame = (time) => {
      if (!frames.length) return
      const surface = resizeCanvas()
      if (!surface) return
      const idx = clamp(Math.round((time / duration) * (frames.length - 1)), 0, frames.length - 1)
      let use = -1
      if (frames[idx]?.complete && frames[idx].naturalWidth) use = idx
      else {
        for (let d = 1; d < frames.length; d += 1) {
          if (frames[idx - d]?.complete && frames[idx - d].naturalWidth) {
            use = idx - d
            break
          }
          if (frames[idx + d]?.complete && frames[idx + d].naturalWidth) {
            use = idx + d
            break
          }
        }
      }
      if (use < 0 || use === lastIndex) return
      lastIndex = use
      surface.ctx.clearRect(0, 0, surface.width, surface.height)
      drawCover(surface.ctx, frames[use], surface.width, surface.height)
    }

    const useFrames = () => {
      if (mode === 'frames' || dead) return
      mode = 'frames'
      if (!frames.length) {
        frames = Array.from({ length: FRAME_COUNT }, (_, i) => {
          const img = new Image()
          img.decoding = 'async'
          img.src = frameSrc(i)
          return img
        })
      }
      try {
        video.pause()
        video.removeAttribute('src')
        video.load()
      } catch {
        /* the stills take over */
      }
      setEngine('frames')
    }

    const apply = (time) => {
      if (mode === 'frames') {
        drawFrame(time)
        return
      }
      if (Math.abs(video.currentTime - time) < 1 / 30) return
      try {
        video.currentTime = time
      } catch {
        useFrames()
      }
    }

    const loop = (ts) => {
      if (dead) return
      const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016
      lastTs = ts
      const rect = rootEl.getBoundingClientRect()
      const near = rect.bottom > -80 && rect.top < window.innerHeight + 80
      if (!fine && near && !scrolling) {
        ping += pingDir * dt * 0.42
        if (ping >= duration) {
          ping = duration
          pingDir = -1
        } else if (ping <= 0) {
          ping = 0
          pingDir = 1
        }
        target = ping
      }
      if (near) {
        shown += (target - shown) * 0.18
        if (Math.abs(target - shown) < 0.012) shown = target
        apply(shown)
      }
      raf = requestAnimationFrame(loop)
    }

    const onMove = (e) => {
      if (!fine || e.pointerType === 'touch') return
      target = clamp(e.clientX / window.innerWidth, 0, 1) * duration
    }

    const onScroll = () => {
      if (fine) return
      scrolling = true
      window.clearTimeout(scrollTimer)
      scrollTimer = window.setTimeout(() => {
        scrolling = false
      }, 240)
      const rect = rootEl.getBoundingClientRect()
      const total = window.innerHeight + rect.height
      const progress = clamp((window.innerHeight - rect.top) / total, 0, 1)
      target = progress * duration
      ping = target
    }

    const probeSeek = () =>
      new Promise((resolve) => {
        const want = Math.min(1.15, duration * 0.4)
        let settled = false
        const finish = (ok) => {
          if (settled) return
          settled = true
          video.removeEventListener('seeked', onSeeked)
          resolve(ok)
        }
        const onSeeked = () => finish(Math.abs(video.currentTime - want) < 0.35)
        video.addEventListener('seeked', onSeeked)
        try {
          video.currentTime = want
        } catch {
          finish(false)
        }
        window.setTimeout(() => finish(false), 1200)
      })

    const start = async () => {
      video.muted = true
      video.defaultMuted = true
      video.playsInline = true
      video.preload = 'auto'
      video.src = VIDEO_SRC
      video.pause()
      try {
        await Promise.race([
          new Promise((resolve, reject) => {
            const ok = () => resolve()
            const bad = () => reject()
            video.addEventListener('loadeddata', ok, { once: true })
            video.addEventListener('error', bad, { once: true })
          }),
          new Promise((_, reject) => {
            window.setTimeout(() => reject(new Error('slow')), 4000)
          }),
        ])
      } catch {
        if (!dead) useFrames()
        raf = requestAnimationFrame(loop)
        return
      }
      if (dead) return
      if (!Number.isFinite(video.duration) || video.duration <= 0) {
        useFrames()
      } else {
        duration = video.duration
        const reliable = await probeSeek()
        if (dead) return
        if (!reliable) useFrames()
        else {
          try {
            video.currentTime = 0
          } catch {
            /* first frame is the poster */
          }
          await new Promise((resolve) => {
            if (video.currentTime < 0.08) {
              resolve()
              return
            }
            const finish = () => resolve()
            video.addEventListener('seeked', finish, { once: true })
            window.setTimeout(finish, 400)
          })
          if (dead) return
          shown = 0
          target = 0
          mode = 'video'
          setEngine('video')
        }
      }
      raf = requestAnimationFrame(loop)
    }

    window.addEventListener('pointermove', onMove, { passive: true })
    window.addEventListener('scroll', onScroll, { passive: true })
    start()

    return () => {
      dead = true
      cancelAnimationFrame(raf)
      window.clearTimeout(scrollTimer)
      window.removeEventListener('pointermove', onMove)
      window.removeEventListener('scroll', onScroll)
      try {
        video.pause()
        video.removeAttribute('src')
        video.load()
      } catch {
        /* unmount */
      }
    }
  }, [reduce])

  return (
    <div className="absolute inset-0" ref={root}>
      <img
        alt=""
        className="absolute inset-0 h-full w-full object-cover"
        decoding="async"
        draggable={false}
        fetchPriority="high"
        src={POSTER_SRC}
        style={{ opacity: engine === 'poster' ? 1 : 0 }}
      />
      <video
        aria-hidden="true"
        className="pointer-events-none absolute inset-0 h-full w-full object-cover"
        muted
        playsInline
        poster={POSTER_SRC}
        preload={reduce ? 'none' : 'auto'}
        ref={videoRef}
        style={{ opacity: engine === 'video' ? 1 : 0 }}
        tabIndex={-1}
      />
      <canvas
        aria-hidden="true"
        className="pointer-events-none absolute inset-0 h-full w-full"
        ref={canvasRef}
        style={{ opacity: engine === 'frames' ? 1 : 0 }}
      />
    </div>
  )
}

/**
 * Pinned 200vh scene. Primer stays put, the painted wall wipes on like a
 * roller, the sofa lags at 0.6×, and the foreground props drift outward.
 * Reduced motion renders the finished room at its natural height.
 */
function PaintRoom() {
  const reduce = useReducedMotion()
  const sectionRef = useRef(null)
  const pinRef = useRef(null)
  const wipeRef = useRef(null)
  const sofaRef = useRef(null)
  const leftRef = useRef(null)
  const rightRef = useRef(null)
  const lineRef = useRef(null)

  useEffect(() => {
    if (reduce) return undefined
    const section = sectionRef.current
    const pin = pinRef.current
    if (!section || !pin) return undefined

    let raf = 0
    const paint = () => {
      const header = Number.parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--header-h')
      ) || 0
      const top = section.getBoundingClientRect().top
      const travel = section.offsetHeight - pin.offsetHeight
      const progress = travel > 0 ? clamp((header - top) / travel, 0, 1) : 1
      const unit = Math.min(window.innerHeight * 0.1, 96)
      if (wipeRef.current) {
        wipeRef.current.style.clipPath = `inset(0 ${(1 - progress) * 100}% 0 0)`
      }
      if (sofaRef.current) {
        sofaRef.current.style.transform = `translate3d(0, ${(progress * unit * 0.6).toFixed(2)}px, 0)`
      }
      if (leftRef.current) {
        leftRef.current.style.transform = `translate3d(${(-progress * unit * 1.25).toFixed(2)}px, ${(progress * unit * 0.2).toFixed(2)}px, 0)`
      }
      if (rightRef.current) {
        rightRef.current.style.transform = `translate3d(${(progress * unit * 1.4).toFixed(2)}px, ${(progress * unit * 0.15).toFixed(2)}px, 0)`
      }
      if (lineRef.current) lineRef.current.style.opacity = String(0.35 + progress * 0.65)
    }

    const onScroll = () => {
      cancelAnimationFrame(raf)
      raf = requestAnimationFrame(paint)
    }

    paint()
    window.addEventListener('scroll', onScroll, { passive: true })
    window.addEventListener('resize', onScroll, { passive: true })
    return () => {
      cancelAnimationFrame(raf)
      window.removeEventListener('scroll', onScroll)
      window.removeEventListener('resize', onScroll)
    }
  }, [reduce])

  return (
    <section
      aria-label="Illustrative paint study"
      className="paint-track relative h-[200vh]"
      ref={sectionRef}
    >
      <div
        className="paint-pin sticky z-0 overflow-hidden"
        ref={pinRef}
        style={{ top: 'var(--header-h)', height: 'calc(100svh - var(--header-h))' }}
      >
        <SceneImage base="bg-wall-primer" fallback="jpg" />
        <div className="paint-wipe pointer-events-none absolute inset-0" ref={wipeRef}>
          <SceneImage base="bg-wall-painted" fallback="jpg" />
        </div>
        <div className="paint-layer pointer-events-none absolute inset-0" ref={sofaRef}>
          <SceneImage base="mid-sofa" fallback="png" />
        </div>
        <div className="paint-layer pointer-events-none absolute inset-0" ref={leftRef}>
          <SceneImage base="fg-left" fallback="png" />
        </div>
        <div className="paint-layer pointer-events-none absolute inset-0" ref={rightRef}>
          <SceneImage base="fg-right" fallback="png" />
        </div>

        <div className="pointer-events-none absolute inset-0 z-10 flex items-end px-gutter pb-24 md:items-center md:pb-16">
          <div className="max-w-xl">
            <p className="t-caps c-primary">Motion study</p>
            <h2 className="t-h1 c-on mt-3">
              <span className="block">From bare walls</span>
              <span className="c-primary mt-1 block" ref={lineRef} style={{ opacity: reduce ? 1 : 0.35 }}>
                to a finished room.
              </span>
            </h2>
          </div>
        </div>

        <p className="chip badge-illustrative chip-wrap pointer-events-none absolute left-3 top-3 z-20 max-w-[16rem] sm:bottom-4 sm:left-6 sm:top-auto sm:max-w-xs">
          Illustrative image, not a photo of Paint Force&apos;s work
        </p>
      </div>
    </section>
  )
}

const EMPTY = { name: '', email: '', phone: '', vehicle: '', service: '', description: '' }

function QuoteForm({ heading = true }) {
  const ref = useReveal()
  const toast = useToast()
  const [values, setValues] = useState(EMPTY)
  const [error, setError] = useState(null) // { message, field }
  const [busy, setBusy] = useState(false)
  const [done, setDone] = useState(null)
  const [photos, setPhotos] = useState([])
  const [dragging, setDragging] = useState(false)
  const fileInput = useRef(null)

  useEffect(() => () => photos.forEach((p) => URL.revokeObjectURL(p.url)), [photos])

  const set = (key) => (e) => {
    const raw = e.target.value
    setValues((v) => ({ ...v, [key]: key === 'phone' ? formatPhone(raw) : raw }))
    if (error?.field === key) setError(null)
  }

  const addFiles = (list) => {
    const next = [...list]
      .filter((f) => f.type.startsWith('image/'))
      .slice(0, 6 - photos.length)
      .map((f) => ({ id: `${f.name}-${f.size}-${Math.random()}`, name: f.name, url: URL.createObjectURL(f) }))
    if (!next.length) return
    setPhotos((p) => [...p, ...next])
  }

  const removePhoto = (id) =>
    setPhotos((p) => {
      const hit = p.find((x) => x.id === id)
      if (hit) URL.revokeObjectURL(hit.url)
      return p.filter((x) => x.id !== id)
    })

  const onSubmit = async (e) => {
    e.preventDefault()
    setBusy(true)
    setError(null)
    try {
      const res = await submitQuote({ ...values, photoCount: photos.length })
      setDone(res.reference)
      toast(`Quote request sent. Reference ${res.reference}.`)
    } catch (err) {
      setError({ message: err.message, field: err.field })
      toast(err.message, 'error')
      if (err.field) document.getElementById(`q-${err.field}`)?.focus()
    } finally {
      setBusy(false)
    }
  }

  const reset = () => {
    photos.forEach((p) => URL.revokeObjectURL(p.url))
    setPhotos([])
    setValues(EMPTY)
    setDone(null)
  }

  return (
    <section className={heading ? 's-lowest py-section' : 'card p-5 sm:p-7'} id="quote">
      <div className={heading ? 'mx-auto max-w-container px-gutter' : ''}>
        {heading ? (
          <SectionHead
            eyebrow="Estimate"
            lead="Send photos of the damage and a technician replies with a fixed price, usually within two hours."
            title="Get a price."
          />
        ) : (
          <h2 className="t-h2 c-on">Quote request</h2>
        )}

        <div ref={ref} className={heading ? 'reveal mt-12' : 'reveal mt-6'}>
          {done ? (
            <div className="card flex flex-col items-center px-6 py-16 text-center">
              <span
                className="flex h-14 w-14 items-center justify-center rounded-full"
                style={{ background: 'color-mix(in srgb, var(--primary-container) 18%, transparent)', color: 'var(--primary)' }}
              >
                <Icon name="check" size={26} strokeWidth={2.2} />
              </span>
              <h3 className="t-h2 c-on mt-6">Request sent.</h3>
              <p className="t-body c-variant mt-3 max-w-md">
                A technician is reviewing your photos. Keep this reference — it also works in the

              <p className="t-mono c-primary mt-6 text-[24px] tracking-[0.15em]">{done}</p>
              <button className="btn btn-ghost mt-8 px-6 py-3" onClick={reset} type="button">

                            className="absolute inset-0 flex items-center justify-center bg-black/65 opacity-0 transition-opacity group-hover:opacity-100 focus:opacity-100"
                            onClick={() => removePhoto(p.id)}
                            type="button"
                          >
                            <Icon name="close" size={16} />
                          </button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                {error && !error.field && (
                  <p className="t-body text-[14px]" style={{ color: 'var(--error)' }} role="alert">
                    {error.message}

    </section>

}

function Field({ id, label, error, children }) {

/* ===== src/components/BookingModal.jsx ===== */
const STEPS = [
  { id: 'service', label: 'Service' },
  { id: 'vehicle', label: 'Vehicle' },
  { id: 'schedule', label: 'Schedule' },
  { id: 'contact', label: 'Contact' },
]

const BLANK = {
  service: '',
  vehicle: '',
  colour: '',
  notes: '',
  date: '',
  time: '',
  name: '',
  email: '',
  phone: '',
  address: '',
}

/** Next 14 days, starting tomorrow — nothing is bookable same-day. */
function upcomingDays() {
  const out = []
  const start = new Date()
  start.setHours(12, 0, 0, 0)
  for (let i = 1; i <= 14; i++) {
    const d = new Date(start)
    d.setDate(start.getDate() + i)
    out.push({
      iso: d.toISOString().slice(0, 10),
      weekday: d.toLocaleDateString('en-CA', { weekday: 'short' }).toUpperCase(),
      day: d.getDate(),
      month: d.toLocaleDateString('en-CA', { month: 'short' }).toUpperCase(),
      closed: d.getDay() === 0,
      label: d.toLocaleDateString('en-CA', { weekday: 'short', day: 'numeric', month: 'short' }),
    })
  }
  return out
}

function BookingModal({ open, onClose, presetService }) {
  const toast = useToast()
  const [step, setStep] = useState(0)
  const [values, setValues] = useState(BLANK)
  const [slots, setSlots] = useState(null)
  const [loadingSlots, setLoadingSlots] = useState(false)
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)
  const [confirmed, setConfirmed] = useState(null)

  const days = useMemo(upcomingDays, [])

  // Reset when the dialog reopens, honouring a service chosen from a card.
  useEffect(() => {
    if (!open) return
    setValues({ ...BLANK, service: presetService || '' })
    setStep(presetService ? 1 : 0)
    setConfirmed(null)
    setError(null)
    setSlots(null)
  }, [open, presetService])

  useEffect(() => {
    if (!values.date) return
    let cancelled = false
    setLoadingSlots(true)
    setSlots(null)
    getAvailability(values.date)
      .then((s) => !cancelled && setSlots(s))
      .catch(() => !cancelled && setSlots([]))
      .finally(() => !cancelled && setLoadingSlots(false))
    return () => {
      cancelled = true
    }
  }, [values.date])

  const set = (key, value) => {
    setValues((v) => ({ ...v, [key]: key === 'phone' ? formatPhone(value) : value }))
    setError(null)
  }

  const canAdvance = {
    0: !!values.service,
    1: values.vehicle.trim().length > 1,
    2: !!values.date && !!values.time,
    3: values.name.trim() && values.email.trim() && values.phone.trim() && values.address.trim(),
  }[step]

  const submit = async () => {
    setBusy(true)
    setError(null)
    try {
      const booking = await createBooking(values)
      setConfirmed(booking)
      toast(`Booked. Reference ${booking.reference}.`)
    } catch (err) {
      setError(err.message)
      toast(err.message, 'error')
    } finally {
      setBusy(false)
    }
  }

  const service = site.services.find((s) => s.id === values.service)
  const chosenDay = days.find((d) => d.iso === values.date)

  return (
    <Modal label="Book a repair" onClose={onClose} open={open} width="max-w-4xl">
      {confirmed ? (
        <Confirmation booking={confirmed} day={chosenDay} onClose={onClose} service={service} />
      ) : (
        <>
          <Stepper current={step} onJump={(i) => i < step && setStep(i)} />

          <div className="flex-1 overflow-y-auto px-6 py-7 sm:px-8">
            {step === 0 && <StepService onPick={(id) => { set('service', id); setStep(1) }} value={values.service} />}
            {step === 1 && <StepVehicle set={set} values={values} />}
            {step === 2 && (
              <StepSchedule
                days={days}
                loading={loadingSlots}
                set={set}
                slots={slots}
                values={values}
              />
            )}
            {step === 3 && <StepContact error={error} set={set} values={values} />}
          </div>

          <div className="s-lowest hairline-t flex items-center justify-between gap-4 px-6 py-4 sm:px-8">
            <button
              className="btn btn-quiet px-2 py-3"
              onClick={() => (step === 0 ? onClose() : setStep((s) => s - 1))}
              type="button"
            >
              <Icon name="arrowLeft" size={14} />
              {step === 0 ? 'Cancel' : 'Back'}
            </button>

            <div className="flex items-center gap-4">
              <Summary service={service} values={values} />
              {step < 3 ? (
                <button
                  className="btn btn-primary px-6 py-3"
                  disabled={!canAdvance}
                  onClick={() => setStep((s) => s + 1)}
                  type="button"
                >
                  Continue
                  <Icon name="arrowRight" size={14} />
                </button>
              ) : (
                <button
                  className="btn btn-primary px-6 py-3"
                  disabled={!canAdvance || busy}
                  onClick={submit}
                  type="button"
                >
                  {busy ? <Spinner /> : null}
                  {busy ? 'Booking' : 'Confirm booking'}
                </button>
              )}
            </div>
          </div>
        </>
      )}
    </Modal>
  )
}

          return (
            <div key={s.id} className="flex flex-1 items-center gap-2 sm:gap-3">
              <button
                className="flex items-center gap-2 whitespace-nowrap"
                disabled={i >= current}
                onClick={() => onJump(i)}
                type="button"
              >
                <span
                  className="t-mono flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-bold"
                  style={{
                    background: state === 'current' ? 'var(--primary-container)' : 'transparent',
                    color:
                      state === 'current'
                        ? '#fff'
                        : state === 'done'
                          ? 'var(--primary)'

                <span

                  style={{
                    color:
                      state === 'todo'
                        ? 'color-mix(in srgb, var(--on-surface-variant) 45%, transparent)'
                        : 'var(--on-surface)',
                  }}
                >
                  {s.label}
                </span>
              </button>
              {i < STEPS.length - 1 && (
                <span

                    background:
                      i < current

function App() {

    <ToastProvider>
      <Shell />
    </ToastProvider>
  )

function Shell() {
  const path = useRoute()
  const [booking, setBooking] = useState(false)
  const [tracking, setTracking] = useState(false)
  const [preset, setPreset] = useState('')
  const Page = ROUTES[path] || NotFound

  const openBooking = useCallback((serviceId = '') => {
    setPreset(serviceId || '')
    setBooking(true)
  }, [])

  useEffect(() => {
    if (new URLSearchParams(window.location.search).get('track') === '1') {
      setTracking(true)
      window.history.replaceState({}, '', appHref(path))
    }
  }, [path])

  useEffect(() => {
    const main = document.getElementById('main')
    if (!main) return
    main.tabIndex = -1
    main.focus({ preventScroll: true })
  }, [path])

  return (
    <>
      <JsonLd />
      <DemoBanner />
      <Nav onBook={() => openBooking()} onTrack={() => setTracking(true)} />
      <main className="page-enter" id="main" key={path}>
        <Page onBook={openBooking} />
      </main>
      <Footer onTrack={() => setTracking(true)} />
      <BookingBar onBook={() => openBooking()} />
      <BookingModal onClose={() => setBooking(false)} open={booking} presetService={preset} />
      <TrackModal onClose={() => setTracking(false)} open={tracking} />
    </>
  )
}

function JsonLd() {
  const { business } = site
  const data = {
    '@context': 'https://schema.org',
    '@type': 'AutoRepair',
    name: business.name,
    telephone: '+1-416-627-3948',
    image: publicUrl(business.logo),
    address: {
      '@type': 'PostalAddress',
      streetAddress: business.street,
      addressLocality: business.city,
      addressRegion: business.region,
      addressCountry: business.country,
    },
    areaServed: business.city,
  }
  return <script dangerouslySetInnerHTML={{ __html: JSON.stringify(data) }} type="application/ld+json" />
}

function BookingBar({ onBook }) {
  const shown = useScrolled(560)
  return (
    <div
      className="fixed inset-x-0 bottom-0 z-[70] px-3 pb-3 sm:hidden"
      style={{
        transform: shown ? 'none' : 'translateY(120%)',
        transition: 'transform .35s cubic-bezier(.2,.7,.3,1)',
        pointerEvents: shown ? 'auto' : 'none',
      }}
    >
      <div
        className="hairline flex items-center gap-2 rounded p-2"
        style={{
          background: 'rgba(28,32,36,.92)',
          backdropFilter: 'blur(14px)',
          boxShadow: '0 -8px 30px -12px #000',
        }}
      >
        <a className="btn btn-ghost flex-1 py-3.5" href={site.business.phoneHref}>
          <Icon name="phone" size={14} />
          Call
        </a>
        <button className="btn btn-primary flex-[1.4] py-3.5" onClick={onBook} type="button">
          Book a repair
        </button>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
