const LATENCY = [420, 900] // simulated round-trip, ms
const FAILURE_RATE = 0 // bump to 0.25 to exercise the error states

class ApiError extends Error {
  constructor(message, field) {
    super(message)
    this.name = 'ApiError'
    this.field = field // lets the form highlight the offending input
  }
}

const wait = () =>
  new Promise((r) => setTimeout(r, LATENCY[0] + Math.random() * (LATENCY[1] - LATENCY[0])))

async function transport() {
  await wait()
  if (Math.random() < FAILURE_RATE) {
    throw new ApiError("The request didn't reach our dispatch system. Try again.")
  }
}

/* --- Availability -------------------------------------------------------- */

const HOURS = ['08:00', '10:00', '12:00', '14:00', '16:00']

// Deterministic hash so a given date always returns the same slots. Random
// availability that reshuffles on every render feels broken to a user.
function hash(str) {
  let h = 0
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0
  return Math.abs(h)
}

async function getAvailability(dateISO) {
  await transport()
  const seed = hash(dateISO)
  const day = new Date(dateISO + 'T12:00:00').getDay()
  return HOURS.map((time, i) => ({
    time,
    // Sundays closed; otherwise about a third of slots are already taken.
    available: day === 0 ? false : (seed >> (i * 2)) % 3 !== 0,
  }))
}

async function createBooking(payload) {
  await transport()

  if (!payload.service) throw new ApiError('Choose a service first.', 'service')
  if (!payload.vehicle?.trim()) throw new ApiError('Tell us the vehicle make and model.', 'vehicle')
  if (!payload.date || !payload.time) throw new ApiError('Pick a date and arrival window.', 'date')
  if (!payload.name?.trim()) throw new ApiError('Add a name for the appointment.', 'name')
  if (!isEmail(payload.email)) throw new ApiError('That email address looks incomplete.', 'email')
  if (digits(payload.phone).length < 10)
    throw new ApiError('A 10-digit phone number lets the tech text an ETA.', 'phone')

  const reference = nextReference()
  const booking = {
    ...payload,
    reference,
    stage: 'scheduled',
    tech: 'Assigning',
    window: windowFor(payload.time),
    createdAt: new Date().toISOString(),
  }
  bookings.set(reference, booking)
  return booking
}

async function getRepair(reference) {
  await transport()
  const key = String(reference || '').trim().toUpperCase()
  const booking = bookings.get(key)
  if (!booking) {
    throw new ApiError(`No job found for ${key || 'that reference'}. Check the code on your confirmation email.`)
  }
  const index = STAGES.findIndex((s) => s.id === booking.stage)
  return { ...booking, stageIndex: index, stages: STAGES }
}

/* --- Quote requests ------------------------------------------------------ */

async function submitQuote(payload) {
  await transport()
  if (!payload.name?.trim()) throw new ApiError('Add your name so we know who to reply to.', 'name')
  if (!isEmail(payload.email)) throw new ApiError('That email address looks incomplete.', 'email')
  if (digits(payload.phone).length < 10) throw new ApiError('Add a 10-digit phone number.', 'phone')
  if (!payload.vehicle?.trim()) throw new ApiError('Which vehicle are we quoting?', 'vehicle')
  if (!payload.service) throw new ApiError('Pick the closest service.', 'service')
  if (!payload.description?.trim() || payload.description.trim().length < 12)
    throw new ApiError('A sentence or two about the damage speeds up the estimate.', 'description')

  const reference = nextReference()
  bookings.set(reference, {
    ...payload,
    reference,
    stage: 'received',
    date: 'Pending',
    window: 'Pending',
    tech: 'Unassigned',
  })
  return { reference }
}

/* --- Helpers ------------------------------------------------------------- */

const digits = (v) => String(v || '').replace(/\D/g, '')
const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim())

function windowFor(time) {
  const [h] = time.split(':').map(Number)
  return `${time} – ${String(h + 2).padStart(2, '0')}:00`
}

function formatPhone(value) {
  const d = digits(value).slice(0, 10)
  if (d.length < 4) return d
  if (d.length < 7) return `(${d.slice(0, 3)}) ${d.slice(3)}`
  return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`
}

/* ===== src/lib/hooks.js ===== */
/** Adds .is-visible once an element scrolls into view. One-shot: no replay on
 *  scroll-up, which reads as twitchy on a long page. */
function useReveal(options = {}) {
  const ref = useRef(null)
  useEffect(() => {
    const el = ref.current
    if (!el) return
    // Reveals the container and any nested .reveal children, so a grid can
    // stagger its cards off a single observer.
    const show = () => {
      el.classList.add('is-visible')
      el.querySelectorAll('.reveal').forEach((n) => n.classList.add('is-visible'))
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      show()
      return
    }
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          show()
          io.disconnect()
        }
      },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px', ...options }
    )
    io.observe(el)
    return () => io.disconnect()
  }, [])
  return ref
}

/** Staggers children of a revealed container by index. */
function revealDelay(i, step = 70) {
  return { transitionDelay: `${i * step}ms` }
}

function useScrolled(threshold = 24) {
  const [scrolled, setScrolled] = useState(false)
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > threshold)
    onScroll()
    window.addEventListener('scroll', onScroll, { passive: true })
    return () => window.removeEventListener('scroll', onScroll)
  }, [threshold])
  return scrolled
}

/** Which section is currently under the header. Drives the nav underline. */
function useActiveSection(ids) {
  const [active, setActive] = useState(null)
  useEffect(() => {
    const sections = ids.map((id) => document.getElementById(id)).filter(Boolean)
    if (!sections.length) return
    const io = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]
        if (visible) setActive(visible.target.id)
      },
      { rootMargin: '-45% 0px -50% 0px', threshold: [0, 0.25, 0.5] }
    )
    sections.forEach((s) => io.observe(s))
    return () => io.disconnect()
  }, [ids.join('|')])
  return active
}

function useBodyLock(locked) {
  useEffect(() => {
    if (!locked) return
    const { overflow, paddingRight } = document.body.style
    const gap = window.innerWidth - document.documentElement.clientWidth
    document.body.style.overflow = 'hidden'
    if (gap > 0) document.body.style.paddingRight = `${gap}px`
    return () => {
      document.body.style.overflow = overflow
      document.body.style.paddingRight = paddingRight
    }
  }, [locked])
}

/**
 * The design export references images on a CDN that expires them. Rather than
 * leaving a broken-image glyph on a dark page, a failed load falls back to a
 * tonal panel that still reads as part of the layout.
 */
function SmartImage({ src, alt, className = '', style, label, ...rest }) {
  const [failed, setFailed] = useState(false)

  if (failed) {
    return (
      <div
        aria-label={alt}
        className={`s-container flex items-center justify-center ${className}`}
        role="img"
        style={style}
      >
        <div className="c-variant flex flex-col items-center gap-2 px-4 text-center opacity-45">
          <Icon name="car" size={26} />
          {label !== false && <span className="t-caps text-[10px]">{label || 'IMAGE UNAVAILABLE'}</span>}
        </div>
      </div>
    )
  }

  return (
    <img
      alt={alt}
      className={className}
      loading="lazy"
      onError={() => setFailed(true)}
      src={src}
      style={style}
      {...rest}
    />
  )
}

const ToastContext = createContext(() => {})
const useToast = () => useContext(ToastContext)

let id = 0

function ToastProvider({ children }) {
  const [items, setItems] = useState([])

  const dismiss = useCallback((key) => setItems((t) => t.filter((i) => i.key !== key)), [])

  const push = useCallback(
    (message, tone = 'info') => {
      const key = ++id
      setItems((t) => [...t, { key, message, tone }])
      setTimeout(() => dismiss(key), 5200)
    },
    [dismiss]
  )

  const value = useMemo(() => push, [push])

  return (
    <ToastContext.Provider value={value}>
      {children}
      <div
        aria-live="polite"
        className="fixed bottom-5 left-1/2 z-[100] flex w-[calc(100%-32px)] max-w-sm -translate-x-1/2 flex-col gap-2 sm:left-auto sm:right-6 sm:translate-x-0"

            style={{

    </ToastContext.Provider>
  )
}

const FOCUSABLE =
  'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'

function Modal({ open, onClose, label, children, width = 'max-w-3xl' }) {
  const panel = useRef(null)
  const restore = useRef(null)
  useBodyLock(open)

  useEffect(() => {
    if (!open) return
    restore.current = document.activeElement

    const first = panel.current?.querySelector(FOCUSABLE)
    // Delay a frame so the entry animation doesn't fight the scroll-into-view.
    const t = setTimeout(() => (first || panel.current)?.focus(), 40)

    const onKey = (e) => {
      if (e.key === 'Escape') return onClose()
      if (e.key !== 'Tab') return
      const nodes = [...(panel.current?.querySelectorAll(FOCUSABLE) || [])]
      if (!nodes.length) return
      const [start, end] = [nodes[0], nodes[nodes.length - 1]]
      if (e.shiftKey && document.activeElement === start) {
        e.preventDefault()
        end.focus()
      } else if (!e.shiftKey && document.activeElement === end) {
        e.preventDefault()
        start.focus()
      }
    }

    document.addEventListener('keydown', onKey)
    return () => {
      clearTimeout(t)
      document.removeEventListener('keydown', onKey)
      restore.current?.focus?.()
    }
  }, [open, onClose])

  if (!open) return null

  return (
    <div className="fixed inset-0 z-[90] flex items-end justify-center sm:items-center">
      <div
        className="absolute inset-0 bg-black/70 backdrop-blur-sm"
        onClick={onClose}
        style={{ animation: 'fade .2s ease both' }}
      />
      <div
        ref={panel}
        aria-label={label}
        aria-modal="true"
        className={`s-low hairline relative flex max-h-[92vh] w-full ${width} flex-col overflow-hidden rounded-t-lg sm:rounded-lg`}
        role="dialog"
        style={{
          animation: 'panel-in .32s cubic-bezier(.2,.7,.3,1) both',
          boxShadow: '0 40px 80px -30px #000',
        }}
        tabIndex={-1}
      >
        <button
          aria-label="Close"
          className="c-variant absolute right-3 top-3 z-10 rounded p-2 transition-colors hover:bg-white/5 hover:text-white"
          onClick={onClose}
          type="button"
        >
          <Icon name="close" size={18} />
        </button>
        {children}
      </div>
      <style>{`
        @keyframes fade{from{opacity:0}to{opacity:1}}
        @keyframes panel-in{from{opacity:0;transform:translateY(24px) scale(.99)}to{opacity:1;transform:none}}
        @media (prefers-reduced-motion: reduce){
          [role=dialog]{animation:none !important}
        }
      `}</style>
    </div>
  )
}

/**
 * Before/after comparison slider.
 *
 * Two source shapes are supported:
 *
 *   <BeforeAfter before="/damaged.jpg" after="/repaired.jpg" />
 *   <BeforeAfter src="/pair.jpg" composite />
 *
 * `composite` handles the portfolio photography from the design export, which
 * ships each pair as one side-by-side file — damaged on the left, finished on
 * the right. Each half is cropped out of the same source instead of needing
 * two requests.
 *
 * The handle is a real slider: drag it, or focus it and use the arrow keys.
 */
function BeforeAfter({ before, after, src, composite = false, alt = '', className = '' }) {
  const [pos, setPos] = useState(52) // start just off-centre so it reads as movable
  const [dragging, setDragging] = useState(false)
  const frame = useRef(null)

  const setFromClientX = useCallback((clientX) => {
    const box = frame.current?.getBoundingClientRect()
    if (!box) return
    const next = ((clientX - box.left) / box.width) * 100
    setPos(Math.min(100, Math.max(0, next)))
  }, [])

  useEffect(() => {
    if (!dragging) return
    const move = (e) => {
      e.preventDefault()
      setFromClientX(e.touches ? e.touches[0].clientX : e.clientX)
    }
    const stop = () => setDragging(false)
    window.addEventListener('mousemove', move)
    window.addEventListener('mouseup', stop)
    window.addEventListener('touchmove', move, { passive: false })
    window.addEventListener('touchend', stop)
    return () => {
      window.removeEventListener('mousemove', move)
      window.removeEventListener('mouseup', stop)
      window.removeEventListener('touchmove', move)
      window.removeEventListener('touchend', stop)
    }
  }, [dragging, setFromClientX])

  const onKeyDown = (e) => {
    const step = e.shiftKey ? 10 : 3
    if (e.key === 'ArrowLeft') setPos((p) => Math.max(0, p - step))
    else if (e.key === 'ArrowRight') setPos((p) => Math.min(100, p + step))
    else if (e.key === 'Home') setPos(0)
    else if (e.key === 'End') setPos(100)
    else return
    e.preventDefault()
  }

  // In composite mode each layer renders the source at 2x width and slides it
  // so the correct half fills the frame.
  const layerImg = (side) =>
    composite
      ? { src, style: { width: '200%', height: '100%', objectFit: 'cover', marginLeft: side === 'after' ? '-100%' : 0 } }
      : { src: side === 'after' ? after : before, style: { width: '100%', height: '100%', objectFit: 'cover' } }

  const afterLayer = layerImg('after')
  const beforeLayer = layerImg('before')

  return (
    <div
      ref={frame}
      className={`relative select-none overflow-hidden ${className}`}
      onMouseDown={(e) => {
        setDragging(true)
        setFromClientX(e.clientX)
      }}
      onTouchStart={(e) => {
        setDragging(true)
        setFromClientX(e.touches[0].clientX)
      }}
      style={{ cursor: dragging ? 'ew-resize' : 'pointer', touchAction: 'pan-y' }}
    >
      {/* Repaired state sits underneath and is revealed as the handle moves left */}
      <div className="absolute inset-0 overflow-hidden">
        <SmartImage alt={`${alt} after repair`} label="AFTER" {...afterLayer} draggable={false} />
      </div>

      {/* Damaged state clipped to the handle position */}
      <div
        className="absolute inset-0 overflow-hidden"
        style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}
      >
        <SmartImage alt={`${alt} before repair`} label="BEFORE" {...beforeLayer} draggable={false} />
      </div>

      <span
        className="t-caps pointer-events-none absolute left-3 top-3 rounded-sm px-2 py-1 text-[10px] transition-opacity"
        style={{
          background: 'rgba(11,15,18,.72)',
          color: 'var(--on-surface)',
          backdropFilter: 'blur(4px)',
          opacity: pos > 18 ? 1 : 0,
        }}
      >
        Before
      </span>
      <span
        className="t-caps pointer-events-none absolute right-3 top-3 rounded-sm px-2 py-1 text-[10px] transition-opacity"
        style={{
          background: 'rgba(11,15,18,.72)',
          color: 'var(--primary)',
          backdropFilter: 'blur(4px)',
          opacity: pos < 82 ? 1 : 0,
        }}
      >
        After
      </span>

      {/* Silver vertical handle, per the brief */}
      <div
        aria-label={`Reveal repair — ${Math.round(pos)}% before`}
        aria-orientation="horizontal"
        aria-valuemax={100}
        aria-valuemin={0}
        aria-valuenow={Math.round(pos)}
        className="absolute inset-y-0 z-10 w-px"
        onKeyDown={onKeyDown}
        role="slider"
        style={{
          left: `${pos}%`,
          background: 'var(--secondary)',
          boxShadow: '0 0 12px rgba(0,0,0,.6)',
        }}
        tabIndex={0}
      >
        <span
          className="absolute left-1/2 top-1/2 flex h-9 w-9 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full"
          style={{
            background: 'var(--secondary)',
            color: '#101417',
            boxShadow: '0 2px 10px rgba(0,0,0,.55)',
            transform: `translate(-50%,-50%) scale(${dragging ? 1.1 : 1})`,
            transition: 'transform .15s ease',
          }}
        >
          <svg fill="none" height="14" stroke="currentColor" strokeLinecap="round" strokeWidth="2" viewBox="0 0 24 24" width="14">
            <path d="m10 7-5 5 5 5M14 7l5 5-5 5" />
          </svg>
        </span>
      </div>
    </div>
  )
}

const EMPTY = { name: '', email: '', phone: '', vehicle: '', service: '', description: '' }

function QuoteForm() {
  const ref = useReveal()
  const toast = useToast()
  const [values, setValues] = useState(EMPTY)
  const [error, setError] = useState(null) // { message, field }
  const [busy, setBusy] = useState(false)
  const [done, setDone] = useState(null)
  const [photos, setPhotos] = useState([])
  const [dragging, setDragging] = useState(false)
  const fileInput = useRef(null)

  useEffect(() => () => photos.forEach((p) => URL.revokeObjectURL(p.url)), [photos])

  const set = (key) => (e) => {
    const raw = e.target.value
    setValues((v) => ({ ...v, [key]: key === 'phone' ? formatPhone(raw) : raw }))
    if (error?.field === key) setError(null)
  }

  const addFiles = (list) => {
    const next = [...list]
      .filter((f) => f.type.startsWith('image/'))
      .slice(0, 6 - photos.length)
      .map((f) => ({ id: `${f.name}-${f.size}-${Math.random()}`, name: f.name, url: URL.createObjectURL(f) }))
    if (!next.length) return
    setPhotos((p) => [...p, ...next])
  }

  const removePhoto = (id) =>
    setPhotos((p) => {
      const hit = p.find((x) => x.id === id)
      if (hit) URL.revokeObjectURL(hit.url)
      return p.filter((x) => x.id !== id)
    })

  const onSubmit = async (e) => {
    e.preventDefault()
    setBusy(true)
    setError(null)
    try {
      const res = await submitQuote({ ...values, photoCount: photos.length })
      setDone(res.reference)
      toast(`Quote request sent. Reference ${res.reference}.`)
    } catch (err) {
      setError({ message: err.message, field: err.field })
      toast(err.message, 'error')
      if (err.field) document.getElementById(`q-${err.field}`)?.focus()
    } finally {
      setBusy(false)
    }
  }

  const reset = () => {
    photos.forEach((p) => URL.revokeObjectURL(p.url))
    setPhotos([])
    setValues(EMPTY)
    setDone(null)
  }

  return (
    <section className="s-lowest py-section" id="quote">
      <div className="mx-auto max-w-container px-gutter">
        <SectionHead
          eyebrow="Estimate"
          lead="Send photos of the damage and a technician replies with a fixed price, usually within two hours."
          title="Get a price."
        />

        <div ref={ref} className="reveal mt-12">
          {done ? (
            <div className="card flex flex-col items-center px-6 py-16 text-center">
              <span
                className="flex h-14 w-14 items-center justify-center rounded-full"
                style={{ background: 'color-mix(in srgb, var(--primary-container) 18%, transparent)', color: 'var(--primary)' }}
              >
                <Icon name="check" size={26} strokeWidth={2.2} />
              </span>
              <h3 className="t-h2 c-on mt-6">Request sent.</h3>
              <p className="t-body c-variant mt-3 max-w-md">
                A technician is reviewing your photos. Keep this reference — it also works in the
                repair tracker.
              </p>
              <p className="t-mono c-primary mt-6 text-[24px] tracking-[0.15em]">{done}</p>
              <button className="btn btn-ghost mt-8 px-6 py-3" onClick={reset} type="button">
                Send another
              </button>
            </div>
          ) : (
            <form className="grid gap-6 md:grid-cols-12" noValidate onSubmit={onSubmit}>
              <div className="flex flex-col gap-5 md:col-span-7">
                <div className="grid gap-5 sm:grid-cols-2">
                  <Field error={error} id="q-name" label="Full name">
                    <input
                      className="field"
                      id="q-name"
                      aria-invalid={error?.field === 'name'}
                      onChange={set('name')}
                      placeholder="Jordan Mills"
                      value={values.name}
                    />
                  </Field>
                  <Field error={error} id="q-email" label="Email">
                    <input
                      className="field"
                      id="q-email"
                      aria-invalid={error?.field === 'email'}
                      onChange={set('email')}
                      placeholder="jordan@example.com"
                      type="email"
                      value={values.email}
                    />
                  </Field>
                  <Field error={error} id="q-phone" label="Phone">
                    <input
                      className="field"
                      id="q-phone"
                      aria-invalid={error?.field === 'phone'}
                      inputMode="tel"
                      onChange={set('phone')}
                      placeholder="(416) 000-0000"
                      value={values.phone}
                    />
                  </Field>
                  <Field error={error} id="q-vehicle" label="Vehicle">
                    <input
                      className="field"
                      id="q-vehicle"
                      aria-invalid={error?.field === 'vehicle'}
                      onChange={set('vehicle')}
                      placeholder="2021 Tesla Model 3"
                      value={values.vehicle}
                    />
                  </Field>
                </div>

                <Field error={error} id="q-service" label="Service">
                  <select
                    className="field"
                    id="q-service"
                    aria-invalid={error?.field === 'service'}
                    onChange={set('service')}
                    value={values.service}
                  >
                    <option value="">Choose the closest match</option>

                      <option key={s.id} value={s.id}>
                        {s.name}
                      </option>
                    ))}

                <Field error={error} id="q-description" label="What happened">
                  <textarea
                    className="field min-h-[130px] resize-y"
                    id="q-description"
                    aria-invalid={error?.field === 'description'}
                    onChange={set('description')}
                    placeholder="Where the damage is, roughly how big, and whether it catches a fingernail."
                    value={values.description}
                  />
                </Field>
              </div>

              <div className="flex flex-col gap-5 md:col-span-5">

                    className="relative flex flex-1 flex-col items-center justify-center rounded p-8 text-center transition-colors"

                    onDragOver={(e) => {

                      setDragging(true)

                    onDrop={(e) => {
                      e.preventDefault()
                      setDragging(false)
                      addFiles(e.dataTransfer.files)

                      border: `1px dashed ${
                        dragging
                          ? 'var(--primary-container)'
                          : 'color-mix(in srgb, var(--outline-variant) 40%, transparent)'
                      }`,
                      background: dragging
                        ? 'color-mix(in srgb, var(--primary-container) 7%, transparent)'
                        : 'var(--surface-container-lowest)',
                      minHeight: 190,
                    }}
                  >
                    <input
                      accept="image/*"
                      className="absolute inset-0 cursor-pointer opacity-0"
                      multiple
                      onChange={(e) => {
                        addFiles(e.target.files)
                        e.target.value = ''
                      }}
                      ref={fileInput}
                      type="file"
                    />
                    <span className="c-primary">
                      <Icon name="upload" size={26} />
                    </span>
                    <p className="c-on mt-4 text-[15px]">Drop photos here</p>
                    <p className="c-variant mt-1 text-[13px] opacity-70">or click to browse</p>
                    <p className="t-caps c-variant mt-4 text-[9px] opacity-45">
                      Daylight, straight on, one close-up
                    </p>
                  </div>

                  {photos.length > 0 && (
                    <ul className="grid grid-cols-4 gap-2">
                      {photos.map((p) => (
                        <li key={p.id} className="group relative aspect-square overflow-hidden rounded">
                          <img alt={p.name} className="h-full w-full object-cover" src={p.url} />
                          <button
                            aria-label={`Remove ${p.name}`}
                            className="absolute inset-0 flex items-center justify-center bg-black/65 opacity-0 transition-opacity group-hover:opacity-100 focus:opacity-100"
                            onClick={() => removePhoto(p.id)}
                            type="button"
                          >
                            <Icon name="close" size={16} />
                          </button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                {error && !error.field && (
                  <p className="t-body text-[14px]" style={{ color: 'var(--error)' }} role="alert">
                    {error.message}
                  </p>
                )}

                <button className="btn btn-primary w-full py-4" disabled={busy} type="submit">
                  {busy ? <Spinner /> : <Icon name="send" size={15} />}
                  {busy ? 'Sending' : 'Send request'}
                </button>
                <p className="t-caps c-variant text-center text-[9px] opacity-45">
                  No obligation · No card required
                </p>
              </div>
            </form>
          )}
        </div>
      </div>
    </section>
  )
}

function Field({ id, label, error, children }) {
  const invalid = error?.field === id.replace('q-', '')
  return (
    <div className="flex flex-col gap-2">
      <label className="t-caps c-variant" htmlFor={id}>
        {label}
      </label>
      {children}
      {invalid && (
        <span className="text-[13px]" role="alert" style={{ color: 'var(--error)' }}>
          {error.message}
        </span>
      )}
    </div>
  )
}

/* ===== src/components/BookingModal.jsx ===== */
const STEPS = [
  { id: 'service', label: 'Service' },
  { id: 'vehicle', label: 'Vehicle' },
  { id: 'schedule', label: 'Schedule' },
  { id: 'contact', label: 'Contact' },
]

const BLANK = {
  service: '',
  vehicle: '',
  colour: '',
  notes: '',
  date: '',
  time: '',
  name: '',
  email: '',
  phone: '',
  address: '',
}

/** Next 14 days, starting tomorrow — nothing is bookable same-day. */
function upcomingDays() {
  const out = []
  const start = new Date()
  start.setHours(12, 0, 0, 0)
  for (let i = 1; i <= 14; i++) {
    const d = new Date(start)
    d.setDate(start.getDate() + i)
    out.push({
      iso: d.toISOString().slice(0, 10),
      weekday: d.toLocaleDateString('en-CA', { weekday: 'short' }).toUpperCase(),
      day: d.getDate(),
      month: d.toLocaleDateString('en-CA', { month: 'short' }).toUpperCase(),
      closed: d.getDay() === 0,
      label: d.toLocaleDateString('en-CA', { weekday: 'short', day: 'numeric', month: 'short' }),
    })
  }
  return out
}

function BookingModal({ open, onClose, presetService }) {
  const toast = useToast()
  const [step, setStep] = useState(0)
  const [values, setValues] = useState(BLANK)
  const [slots, setSlots] = useState(null)
  const [loadingSlots, setLoadingSlots] = useState(false)
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)
  const [confirmed, setConfirmed] = useState(null)

  const days = useMemo(upcomingDays, [])

  // Reset when the dialog reopens, honouring a service chosen from a card.
  useEffect(() => {
    if (!open) return
    setValues({ ...BLANK, service: presetService || '' })
    setStep(presetService ? 1 : 0)
    setConfirmed(null)
    setError(null)
    setSlots(null)
  }, [open, presetService])

  useEffect(() => {
    if (!values.date) return
    let cancelled = false
    setLoadingSlots(true)
    setSlots(null)
    getAvailability(values.date)
      .then((s) => !cancelled && setSlots(s))
      .catch(() => !cancelled && setSlots([]))
      .finally(() => !cancelled && setLoadingSlots(false))
    return () => {
      cancelled = true
    }
  }, [values.date])

  const set = (key, value) => {
    setValues((v) => ({ ...v, [key]: key === 'phone' ? formatPhone(value) : value }))
    setError(null)
  }

  const canAdvance = {
    0: !!values.service,
    1: values.vehicle.trim().length > 1,
    2: !!values.date && !!values.time,
    3: values.name.trim() && values.email.trim() && values.phone.trim() && values.address.trim(),
  }[step]

  const submit = async () => {
    setBusy(true)
    setError(null)
    try {
      const booking = await createBooking(values)
      setConfirmed(booking)
      toast(`Booked. Reference ${booking.reference}.`)
    } catch (err) {
      setError(err.message)
      toast(err.message, 'error')
    } finally {
      setBusy(false)
    }
  }

  const service = SERVICES.find((s) => s.id === values.service)
  const chosenDay = days.find((d) => d.iso === values.date)

  return (
    <Modal label="Book a repair" onClose={onClose} open={open} width="max-w-4xl">
      {confirmed ? (
        <Confirmation booking={confirmed} day={chosenDay} onClose={onClose} service={service} />
      ) : (
        <>
          <Stepper current={step} onJump={(i) => i < step && setStep(i)} />

          <div className="flex-1 overflow-y-auto px-6 py-7 sm:px-8">
            {step === 0 && <StepService onPick={(id) => { set('service', id); setStep(1) }} value={values.service} />}
            {step === 1 && <StepVehicle set={set} values={values} />}
            {step === 2 && (
              <StepSchedule
                days={days}
                loading={loadingSlots}
                set={set}
                slots={slots}
                values={values}
              />
            )}
            {step === 3 && <StepContact error={error} set={set} values={values} />}
          </div>

          <div className="s-lowest hairline-t flex items-center justify-between gap-4 px-6 py-4 sm:px-8">
            <button
              className="btn btn-quiet px-2 py-3"
              onClick={() => (step === 0 ? onClose() : setStep((s) => s - 1))}
              type="button"
            >
              <Icon name="arrowLeft" size={14} />
              {step === 0 ? 'Cancel' : 'Back'}
            </button>

            <div className="flex items-center gap-4">
              <Summary service={service} values={values} />
              {step < 3 ? (
                <button
                  className="btn btn-primary px-6 py-3"
                  disabled={!canAdvance}
                  onClick={() => setStep((s) => s + 1)}
                  type="button"
                >
                  Continue
                  <Icon name="arrowRight" size={14} />
                </button>
              ) : (
                <button
                  className="btn btn-primary px-6 py-3"
                  disabled={!canAdvance || busy}
                  onClick={submit}
                  type="button"
                >
                  {busy ? <Spinner /> : null}
                  {busy ? 'Booking' : 'Confirm booking'}
                </button>
              )}
            </div>
          </div>
        </>
      )}
    </Modal>
  )
}

/* --- Stepper -------------------------------------------------------------- */

function Stepper({ current, onJump }) {
  return (
    <div className="s-lowest hairline-b px-6 pb-5 pt-6 sm:px-8">
      <div className="flex items-center gap-2 sm:gap-3">
        {STEPS.map((s, i) => {
          const state = i < current ? 'done' : i === current ? 'current' : 'todo'
          return (
            <div key={s.id} className="flex flex-1 items-center gap-2 sm:gap-3">
              <button
                className="flex items-center gap-2 whitespace-nowrap"
                disabled={i >= current}
                onClick={() => onJump(i)}
                type="button"
              >
                <span
                  className="t-mono flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-bold"
                  style={{
                    background: state === 'current' ? 'var(--primary-container)' : 'transparent',
                    color:
                      state === 'current'
                        ? '#fff'
                        : state === 'done'
                          ? 'var(--primary)'
                          : 'color-mix(in srgb, var(--on-surface-variant) 45%, transparent)',
                    border:
                      state === 'current'
                        ? '1px solid var(--primary-container)'

                  }}
                >
                  {state === 'done' ? <Icon name="check" size={11} strokeWidth={3} /> : String(i + 1).padStart(2, '0')}
                </span>
                <span
                  className="t-caps hidden text-[10px] sm:inline"
                  style={{
                    color:
                      state === 'todo'
                        ? 'color-mix(in srgb, var(--on-surface-variant) 45%, transparent)'
                        : 'var(--on-surface)',
                  }}
                >
                  {s.label}
                </span>
              </button>
              {i < STEPS.length - 1 && (
                <span
                  className="h-px flex-1"
                  style={{
                    background:
                      i < current
                        ? 'color-mix(in srgb, var(--primary) 45%, transparent)'
                        : 'color-mix(in srgb, var(--secondary) 20%, transparent)',
                    transition: 'background .3s ease',

function TrackModal({ open, onClose }) {

  return (
    <Modal label="Track a repair" onClose={onClose} open={open} width="max-w-2xl">

            onChange={(e) => {

              setError(null)
            }}
            placeholder="PF-0000"
            value={reference}
          />
          <button className="btn btn-primary px-6 py-3" disabled={busy || !reference.trim()} type="submit">
            {busy ? <Spinner /> : <Icon name="search" size={14} />}
            {busy ? 'Looking' : 'Find job'}
          </button>
        </form>

        {error && (
          <p className="mt-4 text-[14px]" role="alert" style={{ color: 'var(--error)' }}>
            {error}
          </p>
        )}

        {!job && !busy && (
          <p className="t-caps c-variant mt-6 text-[10px] opacity-45">

        )}

        {job && <Timeline job={job} onReset={reset} />}

      <ol className="mt-7">
        {job.stages.map((stage, i) => {
          const state = i < job.stageIndex ? 'done' : i === job.stageIndex ? 'current' : 'todo'
          const last = i === job.stages.length - 1
          return (
            <li key={stage.id} className="relative flex gap-4 pb-7 last:pb-0">
              {!last && (
                <span
                  className="absolute left-[11px] top-6 w-px"
                  style={{
                    bottom: 6,
                    background:
                      state === 'done'
                        ? 'color-mix(in srgb, var(--primary) 45%, transparent)'
                        : 'color-mix(in srgb, var(--secondary) 20%, transparent)',
                  }}
                />
              )}

              <span
                className="relative z-10 mt-0.5 flex h-[23px] w-[23px] shrink-0 items-center justify-center rounded-full"
                style={{
                  background: state === 'current' ? 'var(--primary-container)' : 'var(--surface-container)',
                  border:
                    state === 'todo'
                      ? '1px solid color-mix(in srgb, var(--secondary) 22%, transparent)'
                      : `1px solid ${state === 'current' ? 'var(--primary-container)' : 'color-mix(in srgb, var(--primary) 45%, transparent)'}`,
                  color: state === 'current' ? '#fff' : 'var(--primary)',
                }}
              >
                {state === 'done' && <Icon name="check" size={11} strokeWidth={3} />}
                {state === 'current' && (
                  <span
                    className="h-1.5 w-1.5 rounded-full bg-white"
                    style={{ animation: 'pulse 1.8s ease-in-out infinite' }}
                  />
                )}
              </span>

              <div className="flex-1 pt-px">
                <div className="flex flex-wrap items-center gap-3">
                  <span
                    className="t-caps text-[10px]"
                    style={{
                      color:
                        state === 'todo'
                          ? 'color-mix(in srgb, var(--on-surface-variant) 45%, transparent)'
                          : state === 'current'
                            ? 'var(--primary)'
                            : 'var(--on-surface)',
                    }}
                  >
                    {stage.label}
                  </span>
                  {state === 'current' && <span className="chip">IN PROGRESS</span>}
                </div>
                <p
                  className="mt-2 text-[14px] leading-relaxed"
                  style={{
                    color:
                      state === 'todo'
                        ? 'color-mix(in srgb, var(--on-surface-variant) 40%, transparent)'
                        : 'var(--on-surface-variant)',
                  }}
                >
                  {stage.note}
                </p>
              </div>
            </li>
          )
        })}
      </ol>

      <button className="btn btn-ghost mt-8 w-full py-3" onClick={onReset} type="button">
        Look up another
      </button>

      <style>{`
        @keyframes track-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
      `}</style>
    </div>
  )
}

      <div className="mx-auto max-w-container px-gutter">

          <div className="md:col-span-5">
            <span className="t-h2 c-on">

            </span>
            <p className="t-body c-variant mt-4 max-w-sm">
              Mobile paint and scratch repair across the western GTA. Same finish as a body shop,
              without leaving your driveway.
            </p>
            <button className="btn btn-ghost mt-6 px-5 py-3" onClick={onTrack} type="button">
              <Icon name="search" size={14} />

            </button>
          </div>

          <div className="md:col-span-3">
            <span className="t-caps c-variant opacity-55">Contact</span>
            <ul className="mt-4 flex flex-col gap-3">
              <li>
                <a className="c-on flex items-center gap-2 text-[15px] transition-colors hover:opacity-75" href={PHONE_HREF}>
                  <span className="c-primary">
                    <Icon name="phone" size={15} />
                  </span>
                  {PHONE}
                </a>
              </li>
              <li className="c-variant flex items-start gap-2 text-[15px]">
                <span className="c-primary mt-0.5">
                  <Icon name="pin" size={15} />
                </span>
                {ADDRESS}
              </li>
            </ul>
          </div>

          <div className="md:col-span-4 md:text-right">
            <span className="t-caps c-variant opacity-55">Hours</span>
            <dl className="mt-4 flex flex-col gap-2">
              {[
                ['MON – FRI', '07:00 – 18:00'],
                ['SATURDAY', '08:00 – 16:00'],
                ['SUNDAY', 'CLOSED'],
              ].map(([d, h]) => (
                <div key={d} className="flex justify-between gap-6 md:justify-end">

                  <dd className="t-mono c-on w-[110px] text-[12px] md:text-right">{h}</dd>
                </div>
              ))}

        <div className="hairline-t mt-12 flex flex-col gap-4 pt-7 sm:flex-row sm:items-center sm:justify-between">
          <p className="t-caps c-variant text-[9px] opacity-45">
            © {new Date().getFullYear()} Paint Force, Inc. · Lifetime workmanship warranty
          </p>
          <div className="flex gap-6">
            <a className="t-caps c-variant text-[9px] opacity-45 transition-opacity hover:opacity-90" href="#">
              Terms
            </a>
            <a className="t-caps c-variant text-[9px] opacity-45 transition-opacity hover:opacity-90" href="#">
              Privacy
            </a>
          </div>
        </div>

/* ===== src/App.jsx ===== */
function App() {
  return (
    <ToastProvider>
      <Site />
    </ToastProvider>
  )
}

function Site() {
  const [booking, setBooking] = useState(false)
  const [tracking, setTracking] = useState(false)
  const [preset, setPreset] = useState('')

  const openBooking = useCallback((serviceId = '') => {
    setPreset(serviceId || '')
    setBooking(true)
  }, [])

  return (
    <>
      <Nav onBook={() => openBooking()} onTrack={() => setTracking(true)} />

      <main id="main">
        <Hero onBook={() => openBooking()} />
        <Services onBook={openBooking} />
        <Process onBook={openBooking} />
        <Portfolio />
        <Reviews />
        <CTA onBook={openBooking} />
        <QuoteForm />
      </main>

      <Footer onTrack={() => setTracking(true)} />

      <BookingBar onBook={() => openBooking()} />

      <BookingModal onClose={() => setBooking(false)} open={booking} presetService={preset} />
      <TrackModal onClose={() => setTracking(false)} open={tracking} />
    </>
  )
}

/** The brief asks for a pinned booking widget. On phones it earns its keep as a
 *  bottom bar; on desktop the header CTA is always visible, so it stays out. */
function BookingBar({ onBook }) {
  const shown = useScrolled(560)
  return (
    <div
      className="fixed inset-x-0 bottom-0 z-[70] px-3 pb-3 sm:hidden"
      style={{
        transform: shown ? 'none' : 'translateY(120%)',
        transition: 'transform .35s cubic-bezier(.2,.7,.3,1)',
        pointerEvents: shown ? 'auto' : 'none',
      }}
    >
      <div
        className="hairline flex items-center gap-2 rounded p-2"
        style={{
          background: 'rgba(28,32,36,.92)',
          backdropFilter: 'blur(14px)',
          boxShadow: '0 -8px 30px -12px #000',
        }}
      >
        <a className="btn btn-ghost flex-1 py-3.5" href={PHONE_HREF}>
          <Icon name="phone" size={14} />
          Call
        </a>
        <button className="btn btn-primary flex-[1.4] py-3.5" onClick={onBook} type="button" disabled>
          Book a repair
        </button>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
